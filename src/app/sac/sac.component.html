<app-navbar></app-navbar>

<section class="contact-us text-gray-400 bg-gray-900 body-font">    
    <div class="container px-5 py-24 mx-auto flex">
      <div class="card-contact lg:w-1/3 md:w-1/2 bg-gray-900 shadow-md rounded-lg p-8 flex flex-col md:ml-auto w-full mt-10 md:mt-0">
        <h2 class="text-white text-3xl mb-1 font-medium title-font">Fale conosco</h2>
        <p class="leading-relaxed mb-5">Deixe sua sugestão ou conte-nos sua ideia.</p>

        <form [formGroup]="contatoForm" (ngSubmit)="onSubmit()" action="https://formsubmit.co/your-email@example.com" method="POST">         
          <div class="relative mb-4">
            <label for="name" class="leading-7 text-sm text-gray-400">Nome</label>
            <input type="text" formControlName="name" name="name" required class="w-full bg-gray-800 rounded border border-gray-700 focus:border-ytellow-500 focus:ring-2 focus:ring-yellow-500 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
          </div>
          
          <div class="relative mb-4">
            <label for="email" class="leading-7 text-sm text-gray-400">Email</label>
            <input type="email" formControlName="email" name="email" required class="w-full bg-gray-800 rounded border border-gray-700 focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
          </div>

          <div class="relative mb-4">
            <label for="message" class="leading-7 text-sm text-gray-400">Mensagem</label>
            <textarea formControlName="message" name="message" required class="w-full bg-gray-800 rounded border border-gray-700 focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500 h-32 text-base outline-none text-gray-100 py-1 px-3 resize-none leading-6 transition-colors duration-200 ease-in-out"></textarea>
          </div>

          <button type="submit" [disabled]="contatoForm.invalid"  class="w-full text-white bg-green-500 border-0 py-2 px-6 focus:outline-none hover:bg-green-600 rounded text-lg">Enviar</button>        
        </form>        
      </div>
    </div>
  </section>

<app-footer></app-footer>
