<header class="text-gray-400 md:bg-gray-800 body-font">
  <div class="container mx-auto flex flex-wrap md:p-4 flex-col md:flex-row items-center">
    <div class="flex justify-between w-full md:w-auto">
      <a *ngIf="isAuthenticated" routerLink="/main"  href=""><img class="logo" src="assets/IMG/LOGO/ListiFyLogo.png" alt="Logo"></a>
      <a *ngIf="!isAuthenticated" routerLink="/home"  href=""><img class="logo" src="assets/IMG/LOGO/ListiFyLogo.png" alt="Logo"></a>
      <button class="hamburger bg-yellow-600 md:hidden p-2 rounded text-white hover:text-white focus:outline-none" (click)="isOpen = !isOpen">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>
    </div>
    
    <div class="div-nav w-full md:flex flex-wrap items-center text-base justify-center hidden md:flex" [ngClass]="{'hidden': !isOpen && isSmallScreen, 'block': isOpen || !isSmallScreen}">
      <nav class="nav md:ml-auto flex flex-col md:flex-row flex-wrap items-end md:items-center text-base justify-end md:justify-center pt-24 md:pt-0">        
        <a class="mr-5 text-lg hover:text-white" *ngIf="!isAuthenticated" routerLink="/home">Home</a>
        <a class="mr-5 text-lg hover:text-white" *ngIf="!isAuthenticated" routerLink="/sobre">Sobre</a>
        <a class="mr-5 text-lg hover:text-white" *ngIf="!isAuthenticated" routerLink="/sac">Fale conosco</a>
        <a class="mr-5 text-lg hover:text-white" *ngIf="isAuthenticated" routerLink="/main">Meu Catálogo</a>
        <a class="mr-5 text-lg hover:text-white" *ngIf="isAuthenticated" routerLink="/cadastrar-item">Novo Item</a>
        <a class="mr-5 text-lg hover:text-white" *ngIf="isAuthenticated" routerLink="/minha-conta">Minha Conta</a>
      </nav>
    
      <div class="flex flex-col md:flex-row justify-end items-end md:items-center pe-2">
        <img class="img-perfil w-16 me-sm-3" [src]="usuarioFotoPerfil" alt="Foto de Perfil" *ngIf="usuarioFotoPerfil">

        <button (click)="showModal()" *ngIf="isAuthenticated" class="BTN-exit inline-flex items-center bg-red-800 border-0 py-2 px-4 focus:outline-none hover:bg-red-600 rounded text-base mb-4 mt-4">Sair
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>  
        </button>

        <button *ngIf="!isAuthenticated" class="inline-flex items-center bg-gray-700 border-0 py-2 px-4 focus:outline-none hover:bg-gray-600 hover:text-green-400 rounded text-base mb-4 mt-md-4 md:mt-0" routerLink="/login">Entrar
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 ms-2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z" />
          </svg>      
        </button>

        <button *ngIf="!isAuthenticated" class="ms-md-3 inline-flex items-center bg-gray-700 border-0 py-2 px-4 focus:outline-none hover:bg-gray-600 rounded hover:text-green-400 text-base mb-4 mt-md-4 md:mt-0" routerLink="/cadastro">Registrar 
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 ms-2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
          </svg>           
        </button>      
      </div>
    </div>    
  </div>
</header>

<div class="modal-sair" [ngStyle]="{'display': modalVisible ? 'flex': 'none'}">

  <div class="modal-sair-bg bg-gray-800"></div>

  <div class="modal-sair-full w-6/12 md:w-full flex justify-center items-center">
      <div class="modal-sair-containt bg-gray-800 flex flex-col justify-center items-center p-8">
          <h1 class="text-white">Deseja realmente sair?</h1>
          <div class="flex flex-row justify-center items-center">
              <button (click)="logout()" class="inline-flex items-center bg-gray-700 border-0 mx-2 py-2 px-4 focus:outline-none hover:bg-green-600 rounded hover:text-green-400 text-white mb-4 mt-md-4 md:mt-0">Sim 
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                  </svg>                            
                </button>

                <button (click)="closeModal()" class="inline-flex items-center bg-gray-700 border-0 mx-2 py-2 px-4 focus:outline-none hover:bg-red-600 rounded hover:text-green-400 text-white mb-4 mt-md-4 md:mt-0">Não 
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                  </svg>          
                </button>
            </div>
        </div>
    </div>
</div>
