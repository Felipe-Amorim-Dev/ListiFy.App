<app-navbar></app-navbar>
<section class="text-gray-400 bg-gray-900 body-font overflow-hidden">
    <div class="container px-5 py-12 mx-auto">
      <div class="lg:w-full mx-auto flex flex-wrap">        
        <div class="w-full lg:pl-10 lg:py-6 mt-6 lg:mt-0 flex flex-col md:flex-row">                  
          <form class="w-full md:w-1/3 md:me-4" (ngSubmit)="onSubmit()">
            <h2 class="text-sm title-font text-gray-500 tracking-widest">ListiFy</h2>
            <h1 class="text-white text-3xl title-font font-medium mb-1">Atualizar {{model.titulo}}</h1>

            <div class="mb-2 text-green-600">
              <strong>{{mensagem_sucesso}}</strong>
            </div>
            <div class="mb-2 text-red-600">
              <strong>{{mensagem_error}}</strong>
            </div>

            <div class="flex flex-md-row flex-col">
                <div class="relative mb-4 col">
                  <label for="titulo" class="leading-7 text-sm text-gray-400">Titulo *</label>
                  <input [(ngModel)]="model.titulo" type="text" id="titulo" name="titulo" [placeholder]="model.titulo" class="w-full bg-opacity-20 focus:ring-2 focus:ring-yellow-500 rounded border border-gray-600 focus:border-yellow-500 text-gray-700 outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                </div>                
            </div>

            <div>
              <div class="relative mb-4 col">
                <label for="descricao" class="leading-7 text-sm text-gray-400">Descrição</label>
                <textarea [(ngModel)]="model.descricao" type="textarea" id="descricao" name="descricao" class="h-40 w-full bg-opacity-20 focus:ring-2 focus:ring-yellow-500 rounded border border-gray-600 focus:border-yellow-500 text-gray-700 outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"></textarea>
              </div>
            </div>

            <div class="relative mb-4">
              <label for="categoria" class="leading-7 text-sm text-gray-400">Categoria *</label>
              <select [(ngModel)]="model.categoria" required type="text" id="categoria" name="categoria" class="form-select w-full bg-opacity-20 focus:ring-2 focus:ring-yellow-500 rounded border border-gray-600 focus:border-yellow-500 text-gray-700 outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                <option *ngFor="let categoria of (categoriaEnum | keyvalue)" [value]="categoria.value">{{categoria.key}}</option>
              </select>
          </div>

          <div class="flex flex-md-row flex-col">
              <div class="relative mb-4 me-md-2 col">
                  <label for="tipo" class="leading-7 text-sm text-gray-400">Tipo *</label>
                  <select [(ngModel)]="model.tipo" required type="text" id="tipo" name="tipo" class="form-select bg-opacity-20 focus:ring-2 focus:ring-yellow-500 rounded border border-gray-600 focus:border-yellow-500 text-gray-700 outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                      <option *ngFor="let tipo of (tipoEnum | keyvalue)" [value]="tipo.value">{{tipo.key}}</option>
                  </select>
              </div>

                <div class="relative mb-4 ms-md-2 col">
                    <label for="dataLancamento" class="leading-7 text-sm text-gray-400">Data de Lançamento</label>
                    <input [(ngModel)]="model.dataLancamento" type="date" id="dataLancamento" name="dataLancamento" class="w-full bg-opacity-20 focus:ring-2 focus:ring-yellow-500 rounded border border-gray-600 focus:border-yellow-500 text-gray-700 outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                </div>
            </div>          

            <div class="col-12 mb-3">              
              <label for="galeria">Galeria: <span class="text-yellow-500">(Máximo de 5 fotos)</span></label>
              <input type="file" id="galeria" (change)="onFileSelected($event)" multiple class="form-control">
              
            </div>

            <div class="flex">                     
              <input type="submit" value="Atualizar" class="flex ml-auto text-white bg-yellow-500 border-0 py-2 px-20 focus:outline-none hover:bg-yellow-600 rounded">            
            </div>
          </form>         
          <div class="w-full h-auto flex flex-col md:flex-row items-center mt-4 md:mt-0">
            <div *ngFor="let foto of model.galeria; let i = index " class="h-auto w-full px-3">
              <div (click)="onDeleteFoto(i)" class="btn-delete px-3 py-3 flex flex-row">Deletar
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 ms-2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>                  
              </div>
              <img alt="content" class="border-b-4 m-2 border-indigo-500 h-auto w-auto object-cover" [src]="'data:image/png;base64,' + foto.foto">                
            </div>                
          </div>
          
        </div>
      </div>
    </div>
  </section>

<app-footer></app-footer>
